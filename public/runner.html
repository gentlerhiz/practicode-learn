<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Runner</title></head>
<body><script>
  // Sandboxed by its own CSP (next.config.ts) and by the iframe's sandbox attribute: an opaque origin,
  // no cookies, no storage, no network and no way to navigate the lesson page.
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== 'run' || typeof e.data.html !== 'string') return
    document.open(); document.write(e.data.html); document.close()
  })
  parent.postMessage({ type: 'ready' }, '*')
</script></body></html>
