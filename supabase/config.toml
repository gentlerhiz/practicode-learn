# Supabase settings this repository manages. `supabase config push` changes only what is declared
# here and leaves everything else as set in the dashboard, so keep this file to what we mean to own.
# Apply it to the dev project with `npm run auth:push` (run it yourself: it uses your own Supabase login).
# Production gets its own values at launch (Task 20).
project_id = "practicode-learn"

[auth]
site_url = "http://localhost:3000"
# Where sign-in may return to: this computer and this project's Vercel previews (which use dev).
additional_redirect_urls = [
  "http://localhost:3000/**",
  "https://practicode-learn-*-idrisaloma120-3188s-projects.vercel.app/**",
]

# Email and password, as designed. Supabase is set to the same minimum as the forms (src/lib/auth/password.ts).
minimum_password_length = 8

[auth.email]
enable_signup = true
# No session until the confirmation link is opened.
enable_confirmations = true
# Confirmation and reset links work for 30 minutes (the reset page says so).
otp_length = 6
otp_expiry = 1800

[auth.email.template.confirmation]
subject = "Confirm your email for PractiCode Learn"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your PractiCode Learn password"
content_path = "./supabase/templates/recovery.html"

# Resend sends the emails (Supabase's own mail service sends 2 an hour). The key stays in .env.local.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_KEY)"
admin_email = "learn@practicode.tech"
sender_name = "PractiCode Learn"

[auth.rate_limit]
email_sent = 30
