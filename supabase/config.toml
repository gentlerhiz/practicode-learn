# Supabase settings this repository manages. `supabase config push` changes only what is declared
# here and leaves everything else as set in the dashboard, so keep this file to what we mean to own.
# Apply it to the dev project with `npm run auth:push` (run it yourself: it uses your own Supabase login).
# Production gets its own values at launch (Task 20).
project_id = "practicode-learn"

[auth]
site_url = "http://localhost:3000"
# Where sign-in may return to: this computer and this project's Vercel previews (which use dev).
additional_redirect_urls = [
  "http://localhost:3000/**",
  "https://practicode-learn-*-idrisaloma120-3188s-projects.vercel.app/**",
]

[auth.email]
enable_signup = true
# Passwordless: a 6-digit code (and a link) that works for 15 minutes.
otp_length = 6
otp_expiry = 900

[auth.email.template.confirmation]
subject = "Your code to finish signing up for PractiCode Learn"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your PractiCode Learn sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Resend sends the emails (Supabase's own mail service sends 2 an hour). The key stays in .env.local.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_KEY)"
admin_email = "learn@practicode.tech"
sender_name = "PractiCode Learn"

[auth.rate_limit]
email_sent = 30
