<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas Night — Onboarding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
<style>
body { margin: 0; background: #050507; }
a { color: #FFFFFF; }
a:hover { color: #FFFFFF; }
.pcl-i { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
@container pcl (max-width: 699px) {
  .pcl-tracks { grid-template-columns: minmax(0, 1fr) !important; }
  .pcl-wrap { padding-left: 16px !important; padding-right: 16px !important; }
  .pcl-h1 { font-size: 30px !important; line-height: 38px !important; }
  .pcl-hide-xs { display: none !important; }
}
</style>
</helmet>
<div style="container-type: inline-size; container-name: pcl; font-family: 'Poppins', system-ui, sans-serif; color: #FFFFFF; background: #050507; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 50%; top: -360px; width: 1200px; height: 800px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(124,58,237,0.34), rgba(5,5,7,0) 80%); pointer-events: none"></div>

<header style="position: relative">
<div class="pcl-wrap" style="max-width: 1000px; margin: 0 auto; padding: 0 24px; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a href="AtlasLanding.dc.html" aria-label="PractiCode Learn home" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<svg viewBox="-10.4 -9.06 20.8 18.12" style="width: 28px; height: 24px" aria-hidden="true"><g style="fill: #FED606; stroke: #FED606; stroke-width: 0.32; stroke-linejoin: round"><polygon points="1.6,8.66 5,8.66 10,0 5,-8.66 -5,-8.66 -10,0 -5,8.66 -1,8.66 -3,5.196 -6,0 -3,-5.196 3,-5.196 6,0 3,5.196 -0.4,5.196" /><polygon points="-2.8,0 -1.4,2.425 1.4,2.425 2.8,0 1.4,-2.425 -1.4,-2.425" /></g></svg>
<span class="pcl-hide-xs" style="font-size: 17px"><span style="font-weight: 400">Practi</span><span style="font-weight: 700">Code</span><span style="font-weight: 400"> Learn</span></span>
</a>
<div style="flex: 1; max-width: 280px; display: flex; flex-direction: column; gap: 6px">
<div aria-hidden="true" style="display: flex; gap: 6px"><span style="flex: 1; height: 5px; border-radius: 3px; background: #B9A2FF; display: block"></span><span style="flex: 1; height: 5px; border-radius: 3px; background: #B9A2FF; display: block"></span><span style="flex: 1; height: 5px; border-radius: 3px; background: #2A1F3F; display: block"></span></div>
<p style="margin: 0; font-size: 12px; color: #A6A1B5; text-align: center">Step 2 of 3</p>
</div>
<a href="AtlasDashboard.dc.html" style="font-size: 14px; color: #A6A1B5">Skip for now</a>
</div>
</header>

<main class="pcl-wrap" style="position: relative; max-width: 820px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 34px; box-sizing: border-box">
<div style="text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center">
<h1 class="pcl-h1" style="margin: 0; font-size: 40px; line-height: 48px; font-weight: 600; letter-spacing: -0.03em">What do you want to learn first?</h1>
<p style="margin: 0; font-size: 16px; line-height: 26px; color: #A6A1B5">No pressure. You can switch any time, and every track starts free.</p>
</div>

<section aria-labelledby="pcl-q1">
<h2 id="pcl-q1" class="pcl-sr" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Choose a track</h2>
<div class="pcl-tracks" role="group" aria-labelledby="pcl-q1" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="text-align: left; display: flex; gap: 16px; align-items: flex-start; padding: 20px; border-radius: 20px; border: 1.5px solid {{t.border}}; background: {{t.bg}}; color: #FFFFFF; font-family: inherit; cursor: pointer; box-sizing: border-box">
<span style="width: 48px; height: 48px; border-radius: 999px; background: radial-gradient(circle, #3B2170, #1A0F2E); border: 1px solid #4A3C68; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="pcl-i" viewBox="0 0 24 24" style="width: 22px; height: 22px" aria-hidden="true"><path d="{{t.icon}}" /></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 600">{{t.name}}</span><span style="font-size: 14px; line-height: 21px; color: #A6A1B5">{{t.line}}</span><span style="font-size: 12px; color: #8A8598; margin-top: 4px">{{t.meta}}</span></span>
<span style="width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid {{t.ring}}; background: {{t.dot}}; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #04130F"><svg class="pcl-i" viewBox="0 0 24 24" style="width: 13px; height: 13px; opacity: {{t.tick}}" aria-hidden="true"><path d="m5 12 5 5L20 7" /></svg></span>
</button>
</sc-for>
</div>
</section>

<section aria-labelledby="pcl-q2" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="pcl-q2" style="margin: 0; font-size: 17px; font-weight: 600">How much time can you give it?</h2>
<div role="group" aria-labelledby="pcl-q2" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{times}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</section>

<section aria-labelledby="pcl-q3" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="pcl-q3" style="margin: 0; font-size: 17px; font-weight: 600">Have you done any of this before?</h2>
<div role="group" aria-labelledby="pcl-q3" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{levels}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</section>

<div aria-live="polite" style="border-radius: 20px; border: 1px solid rgba(47,245,201,0.35); background: linear-gradient(90deg, rgba(47,245,201,0.06), rgba(124,58,237,0.10)); padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start">
<svg class="pcl-i" viewBox="0 0 24 24" style="width: 22px; height: 22px; color: #2FF5C9; flex-shrink: 0; margin-top: 2px" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z" /></svg>
<p style="margin: 0; font-size: 15px; line-height: 24px"><span style="font-weight: 600">Your plan: </span><span style="color: #D9D3EA">{{plan}}</span></p>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<a href="#" style="font-size: 15px; font-weight: 500; color: #A6A1B5; height: 48px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none"><svg class="pcl-i" viewBox="0 0 24 24" style="width: 18px; height: 18px" aria-hidden="true"><path d="M19 12H5" /><path d="m11 18-6-6 6-6" /></svg>Back</a>
<a href="AtlasDashboard.dc.html" style="text-decoration: none; font-size: 16px; font-weight: 600; height: 52px; padding: 0 28px; display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; background: #FED606; color: #000000">Continue<svg class="pcl-i" viewBox="0 0 24 24" style="width: 18px; height: 18px" aria-hidden="true"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></svg></a>
</div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { track: 'fe', time: 't20', level: 'l0' };
  }
  renderVals() {
    const st = this.state || {};
    const TRACKS = [
      { id: 'fe', name: 'Front-End Web Development', line: 'Build websites that look right on every screen.', meta: '12 modules · Beginner', icon: 'm16 18 6-6-6-6M8 6l-6 6 6 6' },
      { id: 'da', name: 'Data Analysis', line: 'Turn messy spreadsheets into clear answers.', meta: '11 modules · Beginner', icon: 'M3 3v18h18M8 17v-4M13 17V8M18 17v-7' },
      { id: 'ux', name: 'UI/UX Product Design', line: 'Design apps people actually enjoy using.', meta: '11 modules · Beginner', icon: 'm12 19 7-7 3 3-7 7zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18zM2 2l7.6 7.6' },
      { id: 'ai', name: 'AI & Machine Learning', line: 'Train models in Python and learn where AI goes wrong.', meta: '12 modules · Intermediate', icon: 'M5 7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2zM9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3' }
    ];
    const tracks = TRACKS.map((t) => {
      const on = t.id === st.track;
      return {
        name: t.name, line: t.line, meta: t.meta, icon: t.icon,
        pressed: on ? 'true' : 'false',
        border: on ? '#B9A2FF' : '#2C2142',
        bg: on ? 'linear-gradient(160deg, rgba(124,58,237,0.28), #120A1F 70%)' : 'linear-gradient(180deg, #120A1F, #0B0613)',
        ring: on ? '#2FF5C9' : '#4A3C68',
        dot: on ? '#2FF5C9' : 'transparent',
        tick: on ? '1' : '0',
        pick: () => this.setState({ track: t.id })
      };
    });
    const pill = (list, key) => list.map((o) => {
      const on = o.id === st[key];
      return {
        label: o.label,
        pressed: on ? 'true' : 'false',
        border: on ? '#FFFFFF' : '#3B2C5C',
        bg: on ? '#FFFFFF' : 'transparent',
        fg: on ? '#0B0613' : '#D9D3EA',
        pick: () => this.setState({ [key]: o.id })
      };
    });
    const TIMES = [
      { id: 't10', label: '10 min a day', week: 'about 70 minutes a week', pace: 'Module 1 done in about a week' },
      { id: 't20', label: '20 min a day', week: 'about 2 hours a week', pace: 'Module 1 done in four or five days' },
      { id: 't30', label: '30 min a day', week: 'about 3 hours a week', pace: 'Module 1 done in three days' },
      { id: 'tw', label: 'Weekends only', week: 'a couple of hours each weekend', pace: 'Module 1 done in one or two weekends' }
    ];
    const LEVELS = [
      { id: 'l0', label: 'Never', note: 'We will start right at the beginning.' },
      { id: 'l1', label: 'A little', note: 'You can test out of anything you already know.' },
      { id: 'l2', label: 'Quite a bit', note: 'Take a quick check and skip ahead.' }
    ];
    const track = TRACKS.find((t) => t.id === st.track) || TRACKS[0];
    const time = TIMES.find((t) => t.id === st.time) || TIMES[1];
    const level = LEVELS.find((t) => t.id === st.level) || LEVELS[0];
    return {
      tracks: tracks,
      times: pill(TIMES, 'time'),
      levels: pill(LEVELS, 'level'),
      plan: track.name + ', ' + time.week + '. That gets ' + time.pace + '. ' + level.note
    };
  }
}
</script>
</body>
</html>
