<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism — Landing chat, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Poppins:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet" />
<style>
body { margin: 0; background: #07060D; }
a { color: #FFFFFF; }
a:hover { color: #FFFFFF; }
.pcl-i { fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; }
.pcl-display { font-family: 'Bricolage Grotesque', 'Poppins', sans-serif; }
.pcl-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
input::placeholder, textarea::placeholder { color: #8B88A0; }

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #07060D; font-family: 'Poppins', system-ui, sans-serif; color: #FFFFFF">
<dc-import name="PrismLanding" hint-size="390px,844px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; z-index: 60; background: rgba(4,3,10,0.72)"></div>
<section role="dialog" aria-label="Ask PractiCode" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 61; height: 740px; display: flex; flex-direction: column; border-radius: 28px 28px 0 0; border: 1px solid #2A2540; border-bottom: none; background: #0F0D1B; overflow: hidden">
<div style="background: linear-gradient(120deg, #2E3BC2 0%, #5A36E6 45%, #A82E86 100%); padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5); display: block"></span>
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 999px; background: #0B0A14; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg viewBox="-10.4 -9.06 20.8 18.12" style="width: 20px; height: 18px" aria-hidden="true"><g style="fill: #FED606; stroke: #FED606; stroke-width: 0.32; stroke-linejoin: round"><polygon points="1.6,8.66 5,8.66 10,0 5,-8.66 -5,-8.66 -10,0 -5,8.66 -1,8.66 -3,5.196 -6,0 -3,-5.196 3,-5.196 6,0 3,5.196 -0.4,5.196" /><polygon points="-2.8,0 -1.4,2.425 1.4,2.425 2.8,0 1.4,-2.425 -1.4,-2.425" /></g></svg></span>
<div style="flex: 1; min-width: 0"><p style="margin: 0; font-size: 16px; font-weight: 600">Ask PractiCode</p><p style="margin: 0; font-size: 12px; color: #E9E4FF">AI assistant · replies in seconds</p></div>
<a href="PrismLandingPhone.dc.html" aria-label="Close chat" style="width: 36px; height: 36px; border-radius: 999px; background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center"><svg class="pcl-i" viewBox="0 0 24 24" style="width: 18px; height: 18px" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></a>
</div>
</div>
<div aria-live="polite" style="flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 10px; align-items: flex-start; max-width: 92%">
<span style="width: 26px; height: 26px; border-radius: 999px; background: linear-gradient(135deg, #3D5AF5, #6E4CF5 55%, #D9306F); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg viewBox="0 0 24 24" style="width: 13px; height: 13px; fill: #FFFFFF" aria-hidden="true"><path d="M11 2.5l2.1 5.9 5.9 2.1-5.9 2.1L11 18.5l-2.1-5.9L3 10.5l5.9-2.1z" /><path d="M19 14.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z" /></svg></span>
<p style="margin: 0; font-size: 14px; line-height: 22px; color: #DCD9EA; background: #161328; border: 1px solid #2A2540; border-radius: 6px 18px 18px 18px; padding: 10px 14px">Hi! I can help you pick a track, explain the plans, or tell you how lessons work. What would you like to know?</p>
</div>
<sc-for list="{{messages}}" as="m" hint-placeholder-count="2">
<sc-if value="{{m.user}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; align-self: flex-end; max-width: 82%; font-size: 14px; line-height: 22px; background: #FFFFFF; color: #07060D; border-radius: 18px 18px 6px 18px; padding: 10px 14px">{{m.text}}</p>
</sc-if>
<sc-if value="{{m.bot}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 10px; align-items: flex-start; max-width: 92%">
<span style="width: 26px; height: 26px; border-radius: 999px; background: linear-gradient(135deg, #3D5AF5, #6E4CF5 55%, #D9306F); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg viewBox="0 0 24 24" style="width: 13px; height: 13px; fill: #FFFFFF" aria-hidden="true"><path d="M11 2.5l2.1 5.9 5.9 2.1-5.9 2.1L11 18.5l-2.1-5.9L3 10.5l5.9-2.1z" /><path d="M19 14.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z" /></svg></span>
<p style="margin: 0; font-size: 14px; line-height: 22px; color: #DCD9EA; background: #161328; border: 1px solid #2A2540; border-radius: 6px 18px 18px 18px; padding: 10px 14px">{{m.text}}</p>
</div>
</sc-if>
</sc-for>
<sc-if value="{{hasChips}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-top: 4px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.ask}}" style="min-height: 38px; padding: 7px 14px; border-radius: 999px; border: 1px solid #3A3456; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 13px; line-height: 20px; text-align: right; cursor: pointer">{{c.q}}</button>
</sc-for>
</div>
</sc-if>
</div>
<div style="padding: 12px 14px 22px; border-top: 1px solid #221E36; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px; border-radius: 999px; border: 1px solid #2A2540; background: #0B0A14; padding: 5px 5px 5px 16px">
<label for="pcl-chat-m" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Your question</label>
<input id="pcl-chat-m" type="text" placeholder="Type your question…" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 15px" />
<button type="button" aria-label="Send" style="width: 40px; height: 40px; border-radius: 999px; border: none; background: #FFFFFF; color: #07060D; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><svg class="pcl-i" viewBox="0 0 24 24" style="width: 18px; height: 18px" aria-hidden="true"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg></button>
</div>
<p style="margin: 0; font-size: 11px; line-height: 16px; color: #8B88A0; text-align: center">AI answers can be wrong. Prefer a person? <a href="mailto:practicodeacademy@gmail.com" style="color: #DCD9EA">Email us</a>.</p>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { asked: ['track'] };
  }
  renderVals() {
    const st = this.state || {};
    const CHAT = [
      { key: 'track', q: 'Which track should I start with?', a: "If you've never coded, Front-End Web Development is a friendly first step: you see your work in the browser from lesson one. If you already live in spreadsheets, Data Analysis builds on that. Still unsure? Module 1 of every track is free, so try two and keep the one you enjoy." },
      { key: 'price', q: 'How much does Pro cost?', a: 'Pro is ₦6,500 a month, or ₦59,000 a year, which saves you about 24%. It starts with a 7-day free trial and you can cancel in one click. If money is tight, you can apply for a scholarship too.' },
      { key: 'phone', q: 'Can I learn on my phone?', a: "Yes. Every lesson works in your phone's browser, and you can save a whole module to keep going offline. A laptop helps for the bigger projects, and each track tells you upfront what you'll need." },
      { key: 'cert', q: 'Will employers recognise the certificate?', a: "It's a verifiable digital badge that lists the exact skills you showed, mapped to frameworks employers use, like SFIA. It isn't a degree, and we won't pretend it is. Anyone can click it to check it's real, and your projects do the rest of the talking." }
    ];
    const asked = st.asked || [];
    const messages = [];
    asked.forEach((k) => {
      const c = CHAT.find((x) => x.key === k);
      if (c) { messages.push({ user: true, bot: false, text: c.q }); messages.push({ user: false, bot: true, text: c.a }); }
    });
    const chips = CHAT.filter((c) => asked.indexOf(c.key) < 0).map((c) => ({ q: c.q, ask: () => this.setState({ asked: asked.concat([c.key]) }) }));
    return { messages: messages, chips: chips, hasChips: chips.length > 0 };
  }
}
</script>
</body>
</html>
