name: Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Tecno Spark 10, Chrome 130, Android 13
  - type: dropdown
    id: network
    attributes:
      label: Connection
      options: ["Wi-Fi", "4G", "3G or slower", "Offline", "Not sure"]
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility
      options:
        - label: I was using a screen reader, keyboard only, zoom or another assistive technology
